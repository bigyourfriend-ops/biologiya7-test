<!DOCTYPE html>
<html lang="kk">
<head>
<meta name="color-scheme" content="light">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Биология 7 · Тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: student = one question per screen in a narrow column; teacher = sidebar + dashboard */
:root{
 --paper:#f2f5f1;--surface:#ffffff;--ink:#16231e;--mute:#5b6a63;--line:#d9e0da;
 --accent:#1c6a51;--accent-ink:#ffffff;--accent-soft:#e0efe7;--sun:#b9790d;--sun-soft:#fbf0d9;
 --good:#23844f;--good-soft:#e2f2e8;--bad:#b23f2b;--bad-soft:#f9e5e0;--before:#b3bdb7;
 --shadow:0 1px 2px rgba(22,35,30,.06),0 4px 16px rgba(22,35,30,.06);
 --display:"Rubik",system-ui,sans-serif;--body:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:17px;margin-right:auto}
.leaf{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:12px}
.tabs a{padding:7px 14px;border-radius:9px;text-decoration:none;color:var(--mute);font-weight:700;font-size:15px}
.tabs a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.muted{color:var(--mute)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.btn.quiet{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:15px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.input:focus{border-color:var(--accent);outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{accent-color:var(--accent);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;cursor:pointer;user-select:none}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip input{display:none}
.chip b{font-family:var(--display);font-weight:600;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--bad);font-size:15px;min-height:1em}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
.qtext{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.35;margin:14px 0 18px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--paper);font-family:var(--display);font-weight:600;font-size:15px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrongsel{border-color:var(--bad);background:var(--bad-soft)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.dots button{width:22px;height:22px;border-radius:7px;border:0;background:var(--line);font-size:11px;cursor:pointer;color:var(--mute);padding:0}
.dots button.done{background:var(--accent-soft);color:var(--accent)}
.dots button.cur{background:var(--accent);color:var(--accent-ink)}
/* results */
.hero{display:flex;gap:24px;align-items:center}
.ring{flex:none}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.rows{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper)}
.crow .num{font-family:var(--display);font-weight:600;color:var(--mute);font-size:15px}
.mini{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.mini i{display:block;height:100%}
.pill{font-weight:700;font-size:14px;padding:4px 10px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.no{background:var(--bad-soft);color:var(--bad)}.pill.fix{background:var(--sun-soft);color:var(--sun)}
.study{border-left:6px solid var(--bad)}
.study.done{border-left-color:var(--good)}
.book{display:flex;gap:12px;align-items:flex-start;background:var(--sun-soft);border-radius:12px;padding:12px 14px;margin:14px 0}
.book svg{flex:none;margin-top:2px}
.study ul{margin:6px 0 4px;padding-left:20px;display:grid;gap:4px}
.miss{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;display:grid;gap:3px}
.miss .a{color:var(--good);font-weight:700}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:12px;user-select:all}
details summary{cursor:pointer;font-weight:700;color:var(--accent)}
/* teacher */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 57px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:grid;align-content:start;gap:4px}
.side .who{padding:4px 10px 14px;font-size:14px;color:var(--mute)}
.side a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.side a.on{background:var(--accent-soft);color:var(--accent)}
.side a span{font-size:12px;background:var(--paper);color:var(--mute);border-radius:99px;padding:1px 8px}
.main{padding:24px clamp(16px,3vw,36px) 64px;display:grid;gap:18px;align-content:start;max-width:1120px;width:100%}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--mute);font-weight:500}
.kpi .l{font-size:14px;color:var(--mute)}
.up{color:var(--good)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sun-soft);color:var(--ink);border-radius:14px;padding:12px 16px;font-size:15px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.chart text{font-family:var(--body);fill:var(--mute);font-size:12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--mute);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;white-space:nowrap}
.heat td.h{text-align:center;font-weight:700;font-size:13px;border:2px solid var(--surface);border-radius:6px}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
textarea.input{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.list{display:grid;gap:6px;font-size:15px}
.vids{display:grid;gap:8px;margin:6px 0 4px}
.vid{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface)}
.vid:hover{border-color:var(--accent)}
.vid .t{display:grid;line-height:1.3}.vid .t small{color:var(--mute)}
.vid .go{margin-left:auto;color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.vlink{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--accent);text-decoration:none}
.vlink:hover{text-decoration:underline}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg4 label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.seg4 label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg4 input{accent-color:var(--accent);margin-top:5px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--paper);color:var(--mute)}
.badge.ok{background:var(--good-soft);color:var(--good)}.badge.warn{background:var(--sun-soft);color:var(--sun)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dist{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:13px;font-weight:700}
.dist span{display:grid;place-items:center;color:var(--accent-ink);min-width:28px}
.keybox{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
@media (max-width:760px){.split,.seg4{grid-template-columns:1fr}}
.qimg{display:block;max-width:100%;max-height:420px;margin:16px auto 0;border-radius:12px;border:1px solid var(--line);background:#fff}
.hidden{display:none!important}
@media (max-width:760px){.shell{grid-template-columns:1fr}.side{grid-auto-flow:column;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side .who{display:none}.side a{white-space:nowrap}.grid2,.seg{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.qtext{font-size:20px}.top{padding:10px 12px}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  ["Қоректік тізбек қай жерде дұрыс көрсетілген?",["Өсімдік → сарышұнақ → жылан → жыртқыш құс","Жылан → өсімдік → сарышұнақ → жыртқыш құс","Жыртқыш құс → жылан → сарышұнақ → өсімдік","Сарышұнақ → өсімдік → жылан → жыртқыш құс"],2,"Тізбек өндірушіден (өсімдіктен) басталып, жыртқышқа қарай жүреді."],
  ["Экологиялық сукцессия дегеніміз не?",["Биоценоздардың бірізді ретпен ауысуы","Жануарлардың көші-қоны","Өсімдіктердің гүлдеуі","Қоректік тізбектің үзілуі"],3,"Сукцессия — бір биоценоздың біртіндеп екіншісіне ауысуы."],
  ["Бірінші реттік сукцессия аумағында алғаш қандай өсімдіктер өседі?",["Қыналар мен мүктер","Қайың мен терек","Астық тұқымдастар","Бұталар"],3,"Жалаңаш тасты жерге алдымен қыналар мен мүктер қоныстанады."],
  ["Кез келген шаруашылық іс-әрекетке тыйым салынған ерекше қорғалатын аумақ:",["Қорық","Ұлттық саябақ","Қорықша","Демалыс аймағы"],6,"Қорықта құрылыс, ағаш кесу, мал жаю т.б. тыйым салынады — бұл жабайы табиғаттың эталоны."],
  ["Тек шағын аумақта ғана тіршілік ететін түрлер (мысалы, жалман) қалай аталады?",["Эндемиктер","Жыртқыштар","Продуценттер","Редуценттер"],7,"Жалман, мензбир суыры, қарақұйрық — Қазақстан эндемиктері."]]},
{r:"II",t:"Тірі организмдерді жүйелеу",p:[40,62],
 s:["Тірі табиғат патшалықтары: бактериялар, саңырауқұлақтар, өсімдіктер, жануарлар (және вирустар).",
    "Бактериялар — ядросы жоқ жасушалар (прокариоттар). Саңырауқұлақтарда өсімдіктерге де, жануарларға да тән белгілер бар.",
    "Жүйелеу (систематика) — организмдерді сипаттайтын, белгілейтін және жіктейтін биология бөлімі. Түрдің қос атауын Карл Линней енгізген.",
    "Түр — құрылысы ұқсас, өзара шағылысып ұрпақ бере алатын даралар жиынтығы. Жануарларда «тип», өсімдіктерде «бөлім» таксоны қолданылады.",
    "Омыртқасыздарға құрттар, буынаяқтылар, ұлулар жатады; омыртқалыларға балықтар, қосмекенділер, жорғалаушылар, құстар, сүтқоректілер жатады.",
    "Дихотомиялық кілтте теза — бір белгінің сипаттамасы, антитеза — қарама-қарсы белгінің сипаттамасы."],
 q:[["Ядросы жоқ жасушалы организмдер (прокариоттар):",["Бактериялар","Саңырауқұлақтар","Өсімдіктер","Жануарлар"],8,"Бактериялар — ядросы жоқ жасушалық құрылымды организмдер."],
  ["Өсімдіктерге де, жануарларға да тән белгілері бар патшалық:",["Саңырауқұлақтар","Бактериялар","Вирустар","Балдырлар"],8,"Саңырауқұлақтарда екі патшалықтың да белгілері кездеседі."],
  ["Түр дегеніміз —",["құрылысы ұқсас, өзара шағылысып ұрпақ бере алатын даралар жиынтығы","бір туысқа жататын барлық организмдер","бір аумақтағы барлық жануарлар","бір класқа жататын даралар"],9,"Түр — жіктеудің негізгі бірлігі."],
  ["Түрдің қос атауын енгізген ғалым:",["Карл Линней","Чарлз Дарвин","Луи Пастер","И.М. Сеченов"],9,"Швед ғалымы К. Линней әр түрге екі сөзден тұратын атау берді: туыс + түр."],
  ["Жануарлардағы «тип» таксонына өсімдіктерде қай таксон сәйкес келеді?",["Бөлім","Класс","Қатар","Туыс"],9,"Жануарларда — тип, өсімдіктерде — бөлім."],
  ["Организмдерді сипаттау, белгілеу және жіктеумен айналысатын биология бөлімі:",["Жүйелеу (систематика)","Экология","Генетика","Анатомия"],9,"Жүйелеудің мақсаты — тірі организмдерді топтарға жіктеу."],
  ["Омыртқасыз жануарларға не жатады?",["Буылтық құрттар, буынаяқтылар, ұлулар","Балықтар","Құстар","Қосмекенділер"],10,"Омыртқасыздардың ішкі қаңқасы болмайды."],
  ["Балықтардың тыныс алу мүшесі:",["Желбезек","Өкпе","Демтүтік","Тері"],10,"Балықтар — денесі қабыршақпен қапталған, желбезекпен тыныс алатын су омыртқалылары."],
  ["Кесірткелер, жыландар, тасбақалар қай класқа жатады?",["Жорғалаушылар","Қосмекенділер","Балықтар","Сүтқоректілер"],10,"Жорғалаушылар (рептилиялар) — көбі құрлықта тіршілік ететін омыртқалылар."],
  ["Дихотомиялық кілттегі «антитеза» — бұл…",["қарама-қарсы белгінің сипаттамасы","бір белгінің сипаттамасы","түрдің атауы","анықтаудың соңғы қадамы"],11,"Теза — бір белгі, антитеза — оған қарама-қарсы белгі. Әр қадамда екеуінің бірі таңдалады."]]},
{r:"III",t:"Жасушалық биология. Су және органикалық заттар",p:[63,85],
 s:["Кез келген жасуша үш бөліктен тұрады: қабықша, цитоплазма және ядро. Ядро тұқымқуалаушылық ақпаратты тасымалдайды.",
    "Жануар жасушасында жасуша қабығы жоқ, плазмалық мембрананың сыртында жұқа қабат — гликокаликс болады.",
    "Өсімдік жасушасында пластидтер бар: жасыл — хлоропластар, түрлі түсті — хромопластар, түссіз — лейкопластар.",
    "Су табиғатта газ, сұйық және қатты күйде бола алады; ол жасушаға көлем мен беріктік береді, фотосинтезге қатысады.",
    "Өсімдік қорегіндегі ең басты элементтер — азот, фосфор, калий. Темір гемоглобиннің құрамына кіреді.",
    "Органикалық тыңайтқыштар — көң, құс саңғырығы, шымтезек, қарашірік; минералды — суперфосфат, калий хлориді, селитра.",
    "Асқорытуда көмірсулар глюкозаға, майлар глицерин мен май қышқылдарына дейін ыдырайды."],
 q:[["Кез келген жасуша қандай үш бөліктен тұрады?",["Қабықша, цитоплазма, ядро","Ядро, вакуоль, хлоропласт","Мембрана, пластид, рибосома","Қабық, жасуша шырыны, крахмал"],12,"Жасуша — өзара байланысқан үш бөліктен тұратын тұтас тірі жүйе."],
  ["Тұқымқуалаушылық ақпаратты тасымалдайтын жасуша бөлігі:",["Ядро","Цитоплазма","Вакуоль","Гликокаликс"],12,"Ядро зат алмасуды басқарады және тұқымқуалаушылық ақпаратты сақтайды."],
  ["Жануар жасушасының мембранасының сыртындағы жұқа қабат:",["Гликокаликс","Целлюлоза қабығы","Хлоропласт","Вакуоль"],12,"Жануар жасушасында қатты қабық жоқ, оның орнына гликокаликс болады."],
  ["Жасыл түсті пластидтер қалай аталады?",["Хлоропластар","Хромопластар","Лейкопластар","Митохондриялар"],12,"Хлоропластардың құрамында хлорофилл бар."],
  ["Түссіз пластидтер қалай аталады?",["Лейкопластар","Хлоропластар","Хромопластар","Рибосомалар"],12,"Лейкопластар — түссіз, хромопластар — түрлі түсті, хлоропластар — жасыл."],
  ["Судың ерекше қасиеті қайсы?",["Табиғатта газ, сұйық және қатты күйде бола алады","Тек сұйық күйде болады","Жылуды мүлде сіңірмейді","Ешбір затты ерітпейді"],13,"Су қалыпты температура ауытқуларында үш күйде де кездеседі."],
  ["Қан пигменті гемоглобиннің құрамына кіретін элемент:",["Темір","Калий","Күкірт","Фосфор"],14,"Темір ферменттердің және гемоглобиннің құрамына кіреді."],
  ["Өсімдік қорегіндегі ең басты үш элемент:",["Азот, фосфор, калий","Темір, мыс, мырыш","Натрий, хлор, йод","Кальций, магний, фтор"],14,"Азот өркеннің өсуін, калий тамыр мен түйнектің өсуін, фосфор жемістің пісуін жақсартады."],
  ["Органикалық тыңайтқышқа мысал:",["Көң, шымтезек, қарашірік","Суперфосфат","Калий хлориді","Аммоний сульфаты"],14,"Органикалық тыңайтқыштар — организмдердің тіршілік қалдықтары."],
  ["Асқорыту жолында көмірсулар неге дейін ыдырайды?",["Глюкозаға","Аминқышқылдарына","Глицерин мен май қышқылдарына","Тек суға"],15,"Глюкоза қанмен жасушаларға жетіп, энергия көзі болады."]]},
{r:"IV",t:"Заттардың тасымалдануы",p:[86,115],
 s:["Өсімдікте зат тасымалдауды тамыр мен өркен атқарады.",
    "Су мен минералды заттар тамырдан жапыраққа ксилема (сүрек түтіктері) арқылы көтеріледі — бұл жоғары ағыс. Органикалық заттар жапырақтан флоэма (сүзгілі түтікшелер) арқылы таралады — бұл төменгі ағыс.",
    "Тамыр қысымы — суды және онда еріген заттарды сабақ бойымен жоғары жылжытатын күш.",
    "Тамыр аймақтары: бөліну, өсу, сору (тамыр түктері бар), өткізу аймақтары. Тамырдың жуандауы камбийдің бөлінуіне байланысты.",
    "Сабақтағы өзек қор жинау қызметін атқарады.",
    "Жүректен қанды алып шығатын тамырлар — артериялар, жүрекке алып келетіндер — веналар. Балықтардың жүрегі екі камералы, қанайналымы тұйық."],
 q:[["Судың тамырдан жапыраққа дейінгі жолы қалай аталады?",["Жоғары ағыс","Төменгі ағыс","Гуттация","Фотосинтез"],17,"Су тамырдан жоғары қарай жылжиды — жоғары ағыс."],
  ["Органикалық заттардың жапырақтан барлық мүшелерге таралуы:",["Төменгі ағыс","Жоғары ағыс","Транспирация","Тамыр қысымы"],17,"Жапырақта түзілген заттар төмен қарай барлық мүшелерге тасымалданады."],
  ["Су мен минералды тұздар қай ұлпа арқылы көтеріледі?",["Ксилема (сүрек)","Флоэма (тін)","Камбий","Эпидерма"],19,"Сүректің түтіктері арқылы су мен минералды тұздар көтеріледі — бұл ксилема."],
  ["Жапырақтан келетін органикалық заттарды тасымалдайтын ұлпа:",["Флоэма","Ксилема","Камбий","Өзек"],19,"Тін (флоэма) — органикалық заттарды өткізетін ұлпа."],
  ["Суды және онда еріген заттарды сабақ бойымен жоғары жылжытатын күш:",["Тамыр қысымы","Гуттация","Фототропизм","Тозаңдану"],20,"Тамырдың сабақты топырақтағы еріген заттармен қамтамасыз ету қабілеті — тамыр қысымы."],
  ["Тамырдың жуандап өсуін қамтамасыз ететін түзуші ұлпа:",["Камбий","Ксилема","Флоэма","Эпидерма"],19,"Камбий жасушалары бөлініп, жаңа ұлпалар түзеді."],
  ["Тамыр түктері орналасқан аймақ қалай аталады?",["Сору аймағы","Өсу аймағы","Бөліну аймағы","Өткізу аймағы"],19,"Тамыр түктері суды сорады, сондықтан бұл — сору аймағы."],
  ["Сабақтағы өзек қандай қызмет атқарады?",["Қор жинау","Суды буландыру","Фотосинтез","Көбею"],18,"Өзекте қоректік заттардың қоры жиналады."],
  ["Жүректен қанды алып шығатын қантамырлар:",["Артериялар","Веналар","Капиллярлар","Лимфа тамырлары"],22,"Артерия — жүректен шығатын, вена — жүрекке келетін тамыр."],
  ["Балықтардың жүрегі неше камералы?",["Екі камералы","Үш камералы","Төрт камералы","Бір камералы"],22,"Балықтардың қанайналымы тұйық, жүрегі екі камералы (жүрекше мен қарынша)."]]},
{r:"V",t:"Тірі организмдердің қоректенуі",p:[116,126],
 s:["Жапырақ — фотосинтез жүретін мүше. Сырты үстіңгі және астыңғы эпидермамен қапталған, ішінде бағаналы және борпылдақ ұлпа бар.",
    "Сағағы бар жапырақ — сағақты, сағағы жоқ — сағақсыз. Бір сағақта бір тақта болса — жай жапырақ, бірнеше тақта болса — күрделі жапырақ.",
    "Жүйкелер — жапырақтың түтікті-талшықты өткізгіш шоқтары. Лептесіктер — ашылып-жабылатын саңылаулар.",
    "Фотосинтез — күн сәулесінің қатысуымен су мен көмірқышқыл газынан органикалық заттардың түзілуі.",
    "Фотосинтезге қажет: су, көмірқышқыл газы, жарық. Соңғы өнімдері: глюкоза мен оттек."],
 q:[["Фотосинтез жүретін өсімдік мүшесі:",["Жапырақ","Тамыр","Гүл","Тұқым"],24,"Жапырақ — фотосинтез жүретін негізгі мүше."],
  ["Фотосинтезге қажет бастапқы заттар мен жағдай:",["Су, көмірқышқыл газы және жарық","Оттек пен глюкоза","Азот пен крахмал","Тек минералды тұздар"],24,"Өсімдік жарықта су мен көмірқышқыл газынан органикалық зат түзеді."],
  ["Фотосинтездің соңғы өнімдері:",["Глюкоза мен оттек","Көмірқышқыл газы мен су","Азот пен су","Крахмал мен көмірқышқыл газы"],24,"Фотосинтез нәтижесінде глюкоза түзіліп, оттек бөлінеді."],
  ["Фотосинтез кезінде өсімдік ауадан қандай газды сіңіреді?",["Көмірқышқыл газы","Оттек","Азот","Сутек"],24,"Көмірқышқыл газы — фотосинтездің бастапқы заты."],
  ["Бір сағақта бір ғана жапырақ тақтасы бар жапырақ:",["Жай жапырақ","Күрделі жапырақ","Сағақсыз жапырақ","Қынапты жапырақ"],23,"Бірнеше тақта болса — күрделі жапырақ."],
  ["Сағағы жоқ жапырақтар қалай аталады?",["Сағақсыз","Сағақты","Күрделі","Жай"],23,"Сағағы бар — сағақты, сағағы жоқ — сағақсыз жапырақ."],
  ["Жапырақтың сыртын қаптайтын үстіңгі және астыңғы қабықша:",["Эпидерма","Бағаналы ұлпа","Борпылдақ ұлпа","Камбий"],23,"Эпидерма жапырақты қорғайды."],
  ["Жапырақтағы түтікті-талшықты өткізгіш шоқтар:",["Жүйкелер","Лептесіктер","Сағақ","Қынап"],23,"Жүйкелер арқылы су келіп, органикалық заттар кетеді."],
  ["Екі жасушамен шектелген, ашылып-жабылатын жапырақ саңылауы:",["Лептесік","Жасымықша","Жүйке","Тамыр түгі"],23,"Лептесіктер арқылы газ алмасу және судың булануы жүреді."],
  ["Фотосинтезді зерттеген, оқулықта аталған ғалым:",["К.А. Тимирязев","И.П. Павлов","С.Г. Навашин","Роберт Кох"],24,"К.А. Тимирязев — өсімдіктердің фотосинтезін зерттеген ғалым."]]},
{r:"VI",t:"Тыныс алу",p:[127,153],
 s:["Тыныс алу — жасушада органикалық заттардың тотығып, тіршілікке қажетті энергияның бөлінуі.",
    "Аэробтар оттекпен тыныс алады (өсімдіктер, жануарлардың көбі). Анаэробтар бос оттексіз ортада тіршілік етеді (ашытқылар, аскарида, таспақұрт). «Анаэроб» ұғымын Луи Пастер енгізген.",
    "Өсімдіктер күндіз де, түнде де тыныс алады; газ алмасу лептесіктер мен жасымықшалар арқылы жүреді.",
    "Тыныс алу мүшелері: суда — желбезек, жәндіктерде — демтүтік (трахея), құрлық омыртқалыларында — өкпе. Құстарда ауа қапшықтары, сүтқоректілерде диафрагма бар.",
    "Адамның тыныс жолдары: мұрын қуысы → аңқа → көмей → кеңірдек → бронхылар → бронхиолалар → альвеолалар.",
    "Аурулардың алдын алу: жеке бас тазалығы, шынықтыру, таза ауада жүру, екпе егу."],
 q:[["Тыныс алу дегеніміз —",["жасушада органикалық заттардың тотығып, энергия бөлінуі","органикалық заттардың түзілуі","судың булануы","тамырдың суды сіңіруі"],25,"Тыныс алу кезінде энергия бөлінеді, ал фотосинтез кезінде органикалық зат түзіледі."],
  ["Бос оттегі жоқ ортада тіршілік ететін организмдер:",["Анаэробтар","Аэробтар","Продуценттер","Автотрофтар"],26,"«Ан» — жоқ, «аэр» — ауа: оттексіз тіршілік."],
  ["Анаэробты организмге мысал:",["Аскарида","Қасқыр","Емен","Бүркіт"],26,"Ішек паразиттері (аскарида, таспақұрт) оттексіз ортаға бейімделген."],
  ["«Анаэробты» ұғымын ғылымға енгізген ғалым:",["Луи Пастер","Карл Линней","Роберт Кох","К.А. Тимирязев"],26,"Л. Пастер 1861 жылы майқышқылды бактерияларды зерттеп, бұл ұғымды енгізді."],
  ["Өсімдіктер қашан тыныс алады?",["Күндіз де, түнде де","Тек күндіз","Тек түнде","Тек көктемде"],27,"Тыныс алу өсімдіктің барлық мүшелерінде үздіксіз жүреді."],
  ["Жәндіктердің тыныс алу мүшесі:",["Демтүтік (трахея)","Желбезек","Өкпе","Тек тері"],28,"Жәндіктерде — демтүтік, шаяндарда — желбезек, өрмекшілерде — жапырақ тәрізді өкпе."],
  ["Құстардың тыныс алу жүйесінің ерекшелігі:",["Ауа қапшықтарының болуы","Желбезектің болуы","Тек терімен тыныс алуы","Демтүтіктің болуы"],28,"Ауа қапшықтары бронхылардан түзіледі және ұшу кезінде тыныс алуға көмектеседі."],
  ["Кеуде қуысын құрсақ қуысынан бөлетін, сүтқоректілерде пайда болған құрылым:",["Диафрагма","Көмей","Кеңірдек","Бронх"],28,"Диафрагма тыныс алу қозғалыстарын қамтамасыз етеді."],
  ["Адам өкпесіндегі бронхиолалар немен аяқталады?",["Альвеолалармен (өкпе көпіршіктерімен)","Көмеймен","Кеңірдекпен","Аңқамен"],29,"Газ алмасу альвеолаларда жүреді."],
  ["Тыныс алу мүшелері ауруларының алдын алудың басты шаралары:",["Жеке бас тазалығы, шынықтыру, екпе егу","Үнемі үйде отыру","Ауызбен тыныс алу","Таза ауада аз жүру"],30,"Дұрыс тыныс алу мұрын арқылы жүреді, таза ауада көп жүру пайдалы."]]},
{r:"VII",t:"Бөліп шығару",p:[154,167],
 s:["Бөліп шығару — зат алмасудың зиянды және артық өнімдерін организмнен шығару.",
    "Көмірсу мен майдың соңғы өнімдері — көмірқышқыл газы мен су; нәруыздардан қосымша азотты қосылыстар түзіледі.",
    "Омыртқалыларда зәр шығарудың негізгі мүшесі — бүйрек. Маңызды бөліп шығару қызметін бауыр да атқарады.",
    "Өсімдіктерде фотосинтез бен тыныс алу — қарама-қарсы процестер. Артық су жапырақтан тамшы түрінде шығады — гуттация (су лептесіктері — гидатодтар арқылы).",
    "Қарапайымдыларда — жиырылғыш вакуоль, жәндіктерде — мальпигий түтікшелері, шаяндарда — жасыл без."],
 q:[["Адам мен омыртқалыларда зәр шығарудың негізгі мүшесі:",["Бүйрек","Бауыр","Өкпе","Жүрек"],31,"Зәр бүйректе түзіледі."],
  ["Зат алмасуда көмірсу мен майдың соңғы өнімдері:",["Көмірқышқыл газы мен су","Азотты қосылыстар","Глюкоза мен оттек","Нәруыздар"],31,"Нәруыздарда бұларға қоса азотты қосылыстар түзіледі."],
  ["Нәруыздар ыдырағанда қосымша қандай заттар түзіледі?",["Азотты қосылыстар","Крахмал","Глюкоза","Хлорофилл"],31,"Нәруыздардың соңғы өнімдері: көмірқышқыл газы, су және азотты қосылыстар."],
  ["Өт сөлін түзетін, маңызды бөліп шығару қызметін атқаратын мүше:",["Бауыр","Жүрек","Асқазан","Өкпе"],31,"Бауыр — бөліп шығару қызметін атқаратын маңызды мүше."],
  ["Өсімдік жапырақтары арқылы артық судың тамшы түрінде бөлінуі:",["Гуттация","Транспирация","Фотосинтез","Тозаңдану"],32,"Гуттация су лептесіктері арқылы жүреді."],
  ["Гуттация қандай құрылым арқылы жүреді?",["Су лептесіктері (гидатодтар)","Тамыр түктері","Жасымықшалар","Тозаңқап"],32,"Гидатодтар — арнайы су лептесіктері."],
  ["Өсімдіктердегі фотосинтез бен тыныс алу — бұл…",["бір-біріне қарама-қарсы процестер","бірдей процестер","тек түнде жүретін процестер","бөліп шығарудың түрлері"],32,"Фотосинтезде глюкоза мен оттек түзіледі, тыныс алуда олар жұмсалады."],
  ["Қарапайымдыларда зәр шығару қызметін атқаратын органоид:",["Жиырылғыш вакуоль","Ядро","Хлоропласт","Асқорыту вакуолі"],33,"Жиырылғыш вакуоль артық су мен зиянды заттарды шығарады."],
  ["Жәндіктердің зәр шығару мүшелері:",["Мальпигий түтікшелері","Бүйрек","Жасыл без","Жиырылғыш вакуоль"],33,"Мальпигий түтікшелері ішектен суды сорып, зиянды заттарды шығарады."],
  ["Шаяндарда бөліп шығару қызметін не атқарады?",["Жұп жасыл без","Бүйрек","Мальпигий түтікшелері","Жиырылғыш вакуоль"],33,"Шаяндарда зәр шығаруды жұп жасыл без атқарады."]]},
{r:"VIII",t:"Қозғалыс",p:[168,180],
 s:["Таксис — бүкіл организмнің тітіркендіргіш әсерінен орын ауыстыруы (мысалы, хламидомонаданың жарыққа қозғалуы).",
    "Тропизм — бір жақты тітіркендіргіш әсерінен өсімдік мүшелерінің бағытты өсуі: фототропизм (жарыққа қарай), оң геотропизм (тамырдың жерге қарай өсуі).",
    "Настия — тітіркендіргішке қатысты бағытсыз қозғалыс (гүлдің ашылып-жабылуы). Нутация — маятник тәрізді немесе шеңбер бойымен қозғалыс.",
    "Фотопериодизм — организмнің жарықтың тәуліктік ырғағына реакциясы. Жарықты жапырақ қабылдайды. Бидай — ұзақ күндік, бақытгүл — қысқа күндік өсімдік.",
    "Қосмекенділер — алғаш рет құрлыққа шыққан омыртқалы жануарлар; олардың аяқтары тірек қызметін атқарады."],
 q:[["Бүкіл организмнің тітіркендіргіш әсерінен орын ауыстыруы:",["Таксис","Тропизм","Настия","Нутация"],34,"Таксисте бүкіл организм қозғалады, ал тропизмде тек мүшелері өседі."],
  ["Бір жақты тітіркендіргіш әсерінен өсімдік мүшелерінің бағытты өсуі:",["Тропизм","Таксис","Фотопериодизм","Гуттация"],34,"Тітіркендіргішке қарай өссе — оң тропизм, одан ары өссе — теріс тропизм."],
  ["Өсімдіктің жарық көзіне қарай өсуі:",["Фототропизм","Геотропизм","Гуттация","Настия"],34,"«Фото» — жарық."],
  ["Тамырдың жерге қарай төмен өсуі:",["Оң геотропизм","Теріс геотропизм","Фототропизм","Таксис"],19,"Тамыр жердің тартылыс күшіне қарай өседі — оң геотропизм."],
  ["Тітіркендіргішке қатысты бағытсыз қозғалыс (мысалы, гүлдің ашылып-жабылуы):",["Настия","Тропизм","Таксис","Нутация"],34,"Настия — жасуша серпімділігінің өзгеруіне байланысты бағытсыз қозғалыс."],
  ["Өсімдік мүшелерінің маятник тәрізді немесе шеңбер бойымен қозғалысы:",["Нутация","Настия","Таксис","Тропизм"],34,"Нутация тургордың циклдік өзгеруіне байланысты."],
  ["Фотопериодизм дегеніміз —",["организмнің жарықтың тәуліктік ырғағына реакциясы","өсімдіктің суды буландыруы","тамырдың өсуі","жануарлардың көші-қоны"],35,"Фотопериодизм — маусымдық өзгерістерге бейімделу реакциясы."],
  ["Жарықты қабылдайтын өсімдік мүшесі:",["Жапырақ","Тамыр","Гүл","Тұқым"],35,"Жапырақ — жарықты қабылдау мүшесі."],
  ["Бидай — қандай өсімдік?",["Ұзақ күндік","Қысқа күндік","Тек түнде гүлдейтін","Жарыққа мүлде тәуелсіз"],35,"Бидай — ұзақ күндік, бақытгүл — қысқа күндік өсімдік."],
  ["Алғаш рет құрлыққа шыққан омыртқалы жануарлар:",["Қосмекенділер","Балықтар","Құстар","Сүтқоректілер"],36,"Қосмекенділердің артқы аяқтары тірек қызметін атқарады."]]},
{r:"IX",t:"Координация және реттелу",p:[181,221],
 s:["Ішекқуыстыларда ең қарапайым — диффузды (торлы) жүйке жүйесі болады.",
    "Нейрон — жүйке ұлпасының құрылымдық бірлігі. Дендриттер — қысқа тармақталған өсінділер, аксон — импульсті басқа жасушаларға беретін ұзын өсінді.",
    "Орталық жүйке жүйесі — ми мен жұлын; шеткі жүйке жүйесі — жүйкелер мен жүйке түйіндері.",
    "Жұлынның қызметі — рефлекстік және өткізгіштік. Сопақша ми — жұлынның жалғасы (жұту, жөтелу, түшкіру, тыныс алу орталықтары). Үлкен ми сыңарларының қыртысы сана мен ойлауды басқарады.",
    "Рефлекс доғасы — жүйке импульстері өтетін жол. Ең қарапайым рефлекс — тізе рефлексі. Туа пайда болған рефлекстер — шартсыз, өмір бойы қалыптасатындар — шартты.",
    "Ішкі мүшелерді вегетативті жүйке жүйесі реттейді. Түс көру — жылдам ұйқы фазасындағы мидың жұмысы. Никотин қантамырларды тарылтып, қан қысымын арттырады."],
 q:[["Ішекқуыстыларға тән ең қарапайым жүйке жүйесі:",["Диффузды (торлы)","Түйінді","Түтікті","Сатылы"],37,"Диффузды жүйке жүйесі денеге тор тәрізді біркелкі таралған."],
  ["Жүйке ұлпасының құрылымдық бірлігі:",["Нейрон","Нефрон","Альвеола","Эпидерма"],38,"Нейрон — жүйке жасушасы."],
  ["Жүйке импульсін жасуша денесінен басқа жасушаларға беретін ұзын өсінді:",["Аксон","Дендрит","Синапс","Рецептор"],38,"Дендриттер — қысқа тармақталған өсінділер, аксон — ұзын өсінді."],
  ["Орталық жүйке жүйесіне не жатады?",["Ми мен жұлын","Жүйкелер мен жүйке түйіндері","Тек жүйкелер","Жүрек пен өкпе"],39,"Жүйкелер мен жүйке түйіндері — шеткі жүйке жүйесі."],
  ["Жұлынның екі негізгі қызметі:",["Рефлекстік және өткізгіштік","Тыныс алу және қоректену","Көру және есту","Ойлау және сөйлеу"],40,"Жұлын қарапайым рефлекстерді жүзеге асырады және импульстерді миға өткізеді."],

/* Fixed variants: A = кіріс + кейінгі тексеру, B = қорытынды, R = қайталауға арналған (A/B-мен қиылыспайды) */
/* Тұрақты нұсқалар: суретсіз сұрақтардан A (9) және B (9) кезектесіп алынады, қалғаны мен сурет сұрақтары — R (қайталау) */
const MAXQ=30;
/* Өтілген бөлімдер (әдепкі таңдау): 1-тоқсан — I–III, 2-тоқсан — IV. Жаңа бөлім өткен сайын осында қосылады */
const STUDIED=[0,1,2,3];
const VAR=CH.map(c=>{const A=[],B=[],R=[];let j=0;c.q.forEach((q,i)=>{if(q[4]){R.push(i);return}if(j<18)(j%2?B:A).push(i);else R.push(i);j++});return{A,B,R}});
function poolFor(ci,stage){return stage==="post"?VAR[ci].B:stage==="prac"?CH[ci].q.map((_,i)=>i):VAR[ci].A}
/* Бір бөлім — терең тест (нұсқаның барлық сұрағы, жаттығуда бүкіл банк); бірнеше бөлім — барлығы 30-дан аспайды, бөлімдерге тең бөлінеді */
function alloc(chs,stage){const k=chs.length,caps=chs.map(ci=>poolFor(ci,stage).length);
 if(k===1)return[caps[0]];const base=Math.floor(MAXQ/k);let rem=MAXQ-base*k;const order=rnd(chs.map((_,i)=>i)),n=chs.map(()=>base);
 order.forEach(i=>{if(rem>0){n[i]++;rem--}});return n.map((x,i)=>Math.min(x,caps[i]))}
function mk(ci,qi){const q=CH[ci].q[qi],idx=rnd([0,1,2,3]);return{ci,qi,text:q[0],opts:idx.map(i=>q[1][i]),ans:idx.indexOf(0),par:q[2],ex:q[3],img:q[4]}}

/* ---------- result code ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function encodeRes(o){const j=JSON.stringify(o),b=btoa(unescape(encodeURIComponent(j))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");return`BIO7-${b}.${hash(j)}`}
function decodeRes(code){const m=String(code).trim().match(/^BIO7-([A-Za-z0-9_-]+)\.([a-z0-9]+)$/);if(!m)return null;
 try{let b=m[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";const j=decodeURIComponent(escape(atob(b)));if(hash(j)!==m[2])return null;
  const o=JSON.parse(j);if(!o.n||!o.c||!o.r||!STAGE[o.s])return null;return o}catch(e){return null}}

function barChart(a,b,c){

  <div class="field"><label>&nbsp;</label><button class="btn" id="kgen">Жаңа кілт жасау</button></div></div><p class="small muted" id="kmsg" role="status"></p></section>
 <section class="card" style="display:grid;gap:10px"><h2>Кілттер</h2>${ks.length?`<div class="rows">${ks.slice().reverse().map(k=>`<div class="crow" style="grid-template-columns:auto 1fr auto"><span class="keybox">${esc(k.k)}</span><span>${esc(k.l||"")}<div class="small muted">${all().filter(x=>x.k===k.k).length} нәтиже</div></span><button class="btn sm quiet kdel" data-k="${esc(k.k)}">Өшіру</button></div>`).join("")}</div>`:`<p class="muted">Әзірге кілт жоқ.</p>`}</section>`}
function bindKeys(){const g=$("#kgen");if(g)g.onclick=async()=>{let k;do{k=String(1000+Math.floor(Math.random()*9000))}while(KEYLIST.some(x=>x.k===k));
  const next=[...KEYLIST,{k,l:$("#klabel").value.trim().slice(0,60),t:Date.now()}];
  try{if(DB)await DB.doc("meta/keys").set({list:next});else lsSave(LS_KEYS,next);KEYLIST=next;teacherView()}catch(e){$("#kmsg").textContent="Кілт сақталмады, қайталап көріңіз."}};
 $$(".kdel").forEach(b=>b.onclick=async()=>{const next=KEYLIST.filter(x=>x.k!==b.dataset.k);try{if(DB)await DB.doc("meta/keys").set({list:next});else lsSave(LS_KEYS,next);KEYLIST=next;teacherView()}catch(e){}})}

/* ================= routing & platform ================= */
let IS_OWNER=false;
const teacherOpen=()=>!$("#v-teacher").classList.contains("hidden");
function route(){const t=APPMODE==="teacher"?"teacher":(APPMODE&&APPMODE!=="teacher")?"test":(location.hash==="#teacher"&&IS_OWNER?"teacher":"test");
 $("#v-test").classList.toggle("hidden",t!=="test");$("#v-teacher").classList.toggle("hidden",t!=="teacher");
 $("#t-test").classList.toggle("on",t==="test");$("#t-teacher").classList.toggle("on",t==="teacher");
 if(t==="teacher")teacherView()}
window.addEventListener("hashchange",()=>{if(APPMODE){route();return}const s=location.hash==="#simple";if(s!==SIMPLE){SIMPLE=s;if(!Q)startView()}route()});
if(APPMODE==="teacher"){IS_OWNER=true;REC=lsLoad(LS_REC);KEYLIST=lsLoad(LS_KEYS)}
if(APPMODE!=="teacher")startView();route();
(async()=>{
 if(APPMODE==="student"||APPMODE==="simple"){IS_OWNER=false}
 else if(!window.claude&&location.protocol==="file:"){IS_OWNER=true;REC=lsLoad(LS_REC);KEYLIST=lsLoad(LS_KEYS)}
 else if(window.claude){const user=await claude.use("user");IS_OWNER=user?.isOwner?.()??false;
  if(IS_OWNER){DB=await claude.use("db");DL=await claude.use("downloads");
    if(!DB){REC=lsLoad(LS_REC);KEYLIST=lsLoad(LS_KEYS)}
   if(DB){const timer=setTimeout(()=>{DBERR="Деректер әзірге жүктелмеді. Интернетті тексеріңіз.";if(teacherOpen())teacherView()},10000);
    DB.collection("results").onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);DBERR=""}REC=snap.docs.map(d=>({...d.data(),id:d.id}));if(teacherOpen())teacherView()},
     ()=>{clearTimeout(timer);DBERR="Деректерге қол жеткізу мүмкін болмады.";if(teacherOpen())teacherView()});
    DB.doc("meta/keys").onSnapshot(d=>{KEYLIST=d.exists?(d.data().list||[]):[];if(teacherOpen())teacherView()},()=>{})}}}
 $("#t-teacher").classList.toggle("hidden",!IS_OWNER);if(APPMODE==="teacher")$("#t-test").classList.add("hidden");route()})();

</script>
</body>
